services:
  - type: web
    name: merchanthub
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MANUS_JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
