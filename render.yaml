services:
  - type: web
    name: merchanthub
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    preDeployCommand: pnpm db:migrate
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MANUS_JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: MANUS_PROJECT_ID
        value: ""
      - key: OWNER_OPEN_ID
        value: ""
      - key: MANUS_OAUTH_API_URL
        value: ""
      - key: MANUS_API_URL
        value: ""
      - key: MANUS_API_KEY
        value: ""
      - key: STRIPE_SECRET_KEY
        value: ""
      - key: STRIPE_WEBHOOK_SECRET
        value: ""
